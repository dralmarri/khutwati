[general]
static=yes
writeprotect=yes

; ---------- مكالمة واردة من البدالة ----------
; سياق [from-pbx] يولّده entrypoint.sh ويوجّه كل تحويلة إلى [incoming] برقمها
#include extensions_lines.conf

[incoming]
; 1) نطلب من خدمة الإشعارات إيقاظ الأجهزة. الرد: "عدد الأجهزة,معرّف المكالمة"
exten => _X.,1,NoOp(Incoming call for ${EXTEN} from ${CALLERID(all)})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(R=${CURL(http://127.0.0.1:18473/internal/notify?ext=${EXTEN}&from=${URIENCODE(${CALLERID(num)})}&name=${URIENCODE(${CALLERID(name)})})})
 same => n,Set(N=${CUT(R,\,,1)})
 same => n,Set(__HPID=${CUT(R,\,,2)})
 same => n,Set(N=${IF($["${N}"=""]?0:${N})})
 same => n,Set(CHANNEL(hangup_handler_push)=hp-ended,s,1)
 same => n,Ringing()
 same => n,Set(END=$[${EPOCH}+${RING_SECONDS}])
; 2) نرنّ على الأجهزة المسجّلة. الجهاز الذي أيقظه الإشعار يسجّل بعد ثوانٍ، لذلك نعيد المحاولة
;    كل 5 ثوانٍ إلى أن تسجّل كل الأجهزة، ثم نرنّ عليها حتى نهاية المدة.
 same => n(loop),Set(LEFT=$[${END}-${EPOCH}])
 same => n,GotoIf($[${LEFT}<=0]?done)
 same => n,Set(C=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,GotoIf($["${C}"=""]?wait)
 same => n,Set(T=${IF($[${FIELDQTY(C,&)}>=${N}]?${LEFT}:5)})
 same => n,Dial(${C},${T},b(hp-header^s^1)U(hp-answered))
 same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?loop)
 same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?wait)
 same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?wait)
 same => n,Goto(done)
 same => n(wait),Wait(1)
 same => n,Goto(loop)
 same => n(done),Hangup()

; يضيف معرّف المكالمة إلى الدعوة حتى يطابقها التطبيق مع الإشعار
[hp-header]
exten => s,1,Set(PJSIP_HEADER(add,X-HP-Call-ID)=${HPID})
 same => n,Return()

; عند الرد على جهاز، أو عند انتهاء المكالمة: نبلّغ خدمة الإشعارات لإيقاف الرنين على بقية الأجهزة
[hp-answered]
exten => s,1,Set(X=${CURL(http://127.0.0.1:18473/internal/answered?id=${HPID})})
 same => n,Return()

[hp-ended]
exten => s,1,Set(X=${CURL(http://127.0.0.1:18473/internal/ended?id=${HPID})})
 same => n,Return()

; ---------- مكالمة صادرة من التطبيق ----------
[from-mobile]
exten => _[+*#0-9].,1,Goto(outgoing,${EXTEN},1)
exten => _[*#0-9],1,Goto(outgoing,${EXTEN},1)

[outgoing]
exten => _[+*#0-9]!,1,NoOp(Outgoing call to ${EXTEN})
 same => n,Set(CALLERID(num)=${HPEXT})
 ; r = نُسمِع التطبيق نغمة الرنين بأنفسنا، لأن البدالة تكتفي بإشارة "يرنّ" بلا صوت
 same => n,Dial(PJSIP/${EXTEN}@pbx${HPEXT},120,r)
 same => n,Hangup()
