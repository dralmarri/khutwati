[global]
type=global
user_agent=HomePhoneGW

; ---------- النقل ----------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${GW_SIP_PORT}

; WebSocket للتطبيق. يستمع عبر خادم HTTP الداخلي (127.0.0.1:18088) وخادم الويب أمامه يضيف TLS.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------- قالب نقطة الاتصال بالبدالة ----------
; نتصل كتحويلة عادية بنفس طريقة Bria: النطاق هو العنوان الداخلي، والوصول عبر العنوان العام كوسيط خارج.
[pbx-aor]
type=aor
contact=sip:${PBX_LAN_IP}:${PBX_LAN_PORT}

[pbx-trunk](!)
type=endpoint
transport=transport-udp
context=from-pbx
disallow=all
allow=alaw,ulaw
aors=pbx-aor
outbound_proxy=sip:${PBX_PUBLIC_HOST}:${PBX_PUBLIC_PORT}\;lr
from_domain=${PBX_LAN_IP}
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ---------- قالب جهاز التطبيق (WebRTC) ----------
[app-device](!)
type=endpoint
transport=transport-ws
context=from-mobile
webrtc=yes
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no

; إعداد كل تحويلة يولّده entrypoint.sh من PBX_EXTS
#include pjsip_lines.conf
