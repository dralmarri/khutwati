[global]
type=global
user_agent=HomePhoneGW

; ---------- النقل ----------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${GW_SIP_PORT}

; WebSocket للتطبيق. يستمع عبر خادم HTTP الداخلي (127.0.0.1:8088) وCaddy يضيف TLS.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------- بدالة باناسونيك ----------
; نسجّل كتحويلة عادية بنفس طريقة Bria: النطاق هو العنوان الداخلي، والوصول عبر العنوان العام كوسيط خارج.
[pbx-reg]
type=registration
transport=transport-udp
outbound_auth=pbx-auth
server_uri=sip:${PBX_LAN_IP}:${PBX_LAN_PORT}
client_uri=sip:${PBX_EXT}@${PBX_LAN_IP}:${PBX_LAN_PORT}
outbound_proxy=sip:${PBX_PUBLIC_HOST}:${PBX_PUBLIC_PORT}\;lr
contact_user=${PBX_EXT}
expiration=300
retry_interval=30
forbidden_retry_interval=300
max_retries=1000000

[pbx-auth]
type=auth
auth_type=userpass
username=${PBX_EXT}
password=${PBX_PASSWORD}

[pbx-aor]
type=aor
contact=sip:${PBX_LAN_IP}:${PBX_LAN_PORT}

[pbx]
type=endpoint
transport=transport-udp
context=from-pbx
disallow=all
allow=alaw,ulaw
aors=pbx-aor
outbound_auth=pbx-auth
outbound_proxy=sip:${PBX_PUBLIC_HOST}:${PBX_PUBLIC_PORT}\;lr
from_user=${PBX_EXT}
from_domain=${PBX_LAN_IP}
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[pbx-identify]
type=identify
endpoint=pbx
match=${PBX_PUBLIC_HOST}

; ---------- التطبيق (WebRTC) ----------
[mobile]
type=aor
max_contacts=5
remove_existing=yes

[mobile-auth]
type=auth
auth_type=userpass
username=mobile
password=${MOBILE_PASSWORD}

[mobile]
type=endpoint
transport=transport-ws
context=from-mobile
aors=mobile
auth=mobile-auth
webrtc=yes
disallow=all
allow=alaw,ulaw
dtmf_mode=rfc4733
direct_media=no
